title: Yong & Wendy
url: ""
baseurl: ""

author: Yong
author:
  name: Yong
  email:
  url:
  avatar:
description: "This is our repository of our newsletters and IT notes."
logo:
image:
permalink: pretty

# twitter: ronaldsvilcins
