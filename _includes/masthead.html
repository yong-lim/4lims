      <header class="masthead">
        <h3 class="masthead-title">
          <a href="{{ site.baseurl }}/" class="{% if page.url == '/' %}active{% endif %}">{{ site.title }}</a>

          <nav role="navigation" class="nav">
            {% for nav in site.data.menu %}
            <small>
              <a href="{{ nav.url }}"
                class="{% if page.url == nav.url %}active{% endif %}">
                {{ nav.name }}</a>
            </small>
            {% endfor %}
          </nav>
        </h3>
      </header>
