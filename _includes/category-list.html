{% assign my_cat = page.title | split: ": " %}
<h3>{{ my_cat }}:</h3>

<div class="grid">
  {% for note in site.notes reversed %}
  {% if note.categories contains page.title %}
  <article role="article" class="card">
    <div class="meta">
    <a href="{{ site.baseurl }}{{ note.url }}">
      <h2>{{ note.title }}</h2>
    </a>
      <p>{{ note.summary }}</p>
      <time class="date" datetime="{{ note.date | date_to_xmlschema }}">
        {{ note.date | date: "%B %-d, %Y" }}
        <!--&middot;
        {% for t in note.tags %}
        #{{t}}{% unless forloop.last %}, {% endunless %}
        {% endfor %}-->
      </time>
    </div>
  </article>
  {% endif %}

  {% endfor %}

</div>
