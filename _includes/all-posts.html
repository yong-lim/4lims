<div class="grid">
  {% for post in site.posts %}
  <article role="article" class="card">
    <div class="meta">
      <a href="{{ site.baseurl }}{{ post.url }}">
        <h2>{{ post.title }}</h2>
      </a>
      <p>{{ post.summary }}</p>
      <time class="date" datetime="{{ post.date | date_to_xmlschema }}">
        {{ post.date | date: "%B %-d, %Y" }} &middot;
        {% for t in post.tags %}
        #{{t}}{% unless forloop.last %}, {% endunless %}
        {% endfor %}
      </time>
    </div>
  </article>
  {% endfor %}
</div>
