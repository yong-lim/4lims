<div class="grid">

  {% for note in site.notes reversed %}

  <article role="article" class="card">
    <a href="{{ site.baseurl }}{{ note.url }}">
      <div class="meta">
        <h2>{{ note.title }}</h2>
        <p>{{ note.summary }}</p>
        <time class="date" datetime="{{ note.date | date_to_xmlschema }}">
          {{ note.date | date: "%B %-d, %Y" }}
          <!--&middot;
          {% for t in note.tags %}
          #{{t}}{% unless forloop.last %}, {% endunless %}
          {% endfor %}-->
        </time>
      </div>
    </a>
  </article>

  {% endfor %}

</div>
