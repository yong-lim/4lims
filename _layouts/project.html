---
layout: default
---

<article class="post" role="article">
	<div class="meta">
  <h3 class="text-center">{{ page.title }}</h3>
	<time class="date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }} &middot; {{ page.tags }}</time>
  <div class="meta">
  {{ content }}
</article>



<script>
  document
    .querySelectorAll('.post pre.highlight')
    .forEach(function (pre) {
      var button = document.createElement('button');
      var copyText = 'Copy';
      button.type = 'button';
      button.ariaLabel = 'Copy code to clipboard';
      button.innerText = copyText;
      console.log('add listener');
      button.addEventListener('click', function () {
        console.log('after click');
        var code = pre.querySelector('code').innerText;
        try {
          code = code.trimEnd();
        } catch (e) {
          code = code.trim();
        }
        console.log(code);
        window.navigator.clipboard.writeText(code);
        button.innerText = 'Copied';
        setTimeout(function () {
          button.blur();
          button.innerText = copyText;
        }, 4000);
      });
      pre.append(button);
    });
</script>
