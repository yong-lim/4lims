---
layout: page
---
<input type="input" id="search-input-notes" class="search-input" placeholder="{{ site.data.text[site.locale].search_placeholder_text | default: 'Enter your search term...' }}" autofocus>

<div id="results-container-notes"></div>

<!-- Configuration -->
<script src="{{ site.baseurl }}/assets/js/simple-jekyll-search.min.js"></script>
<script>
let queryResults =
  '<article role="article" class="card-search">
    <a href="{url}?query={query}" title="{desc}">
      <div class="meta">
        <h3>{title}</h3>
      </div>
    </a>
  </article>';

window.simpleJekyllSearch = new SimpleJekyllSearch({
  searchInput: document.getElementById('search-input-notes'),
  resultsContainer: document.getElementById('results-container-notes'),
  json: '{{ site.baseurl }}/search-notes.json',
  searchResultTemplate: queryResults,
  noResultsText: 'No results found',
  limit: 10,
  fuzzy: false,
  exclude: ['Welcome']
})
</script>
