---
layout: default
---
<div class="post">
  <h2 class="post-title">{{ page.title | escape }}</h2>
  <time class="date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }} &middot;
  {% for t in page.tags %}
  {% assign url = "/tag/" | append: t | append: "/" %}
    <a href="{{ url }}">
    #{{t}}{% unless forloop.last %}, {% endunless %}
    </a>
  {% endfor %}</time>
  {{ content }}

</div>
